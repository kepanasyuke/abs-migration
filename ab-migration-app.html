<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АБС-Миграция — рабочее место аналитика</title>
<meta name="description" content="Приложение системного аналитика для миграции банковских данных из legacy-АБС в ЦФТ-Банк: карта данных, качество, сверка, правила, проводки, cut-over, ассистент и контроль готовности.">
<style>
  :root{
    --ink:#24262a;
    --text:#55595f;
    --muted:#9aa0a6;
    --line:#e4e6ee;
    --line-soft:#eceef5;
    --red:#d82335;
    --red-dark:#b81b2b;
    --red-pale:#fdeef0;
    --pink:#f20c4d;
    --green:#1f8a5b;
    --green-pale:#e8f5ee;
    --amber:#b7791f;
    --amber-pale:#fdf3e0;
    --bg:#f6f6fb;
    --card:#ffffff;
    --shadow:0 2px 10px rgba(36,38,42,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:18px/1.6 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{color:var(--ink);margin:0;font-weight:600;line-height:1.28}
  p{margin:0}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:296px 1fr;min-height:100vh}

  .side{background:#fff;border-right:1px solid var(--line-soft);padding:24px 0 28px;position:sticky;top:0;height:100vh;overflow:auto}
  .side-brand{display:flex;gap:14px;align-items:center;padding:0 24px 22px}
  .mark{width:46px;height:46px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:.02em}
  .side-brand b{display:block;color:var(--ink);font-size:18px;letter-spacing:-.01em}
  .side-brand span{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
  .side-group{padding:14px 24px 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .navitem{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 24px;font-size:17px;color:#464a51;border-left:3px solid transparent;
  }
  .navitem i{font-style:normal;font-size:12px;color:var(--muted);width:22px;letter-spacing:.06em}
  .navitem:hover{background:#fbfbfe;color:var(--red)}
  .navitem.on{background:var(--red-pale);color:var(--red);border-left-color:var(--red);font-weight:600}
  .navitem.on i{color:var(--red)}
  .side-foot{padding:20px 24px 0;font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft);margin-top:18px}
  .side-foot b{color:var(--ink)}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{
    background:#fff;border-bottom:1px solid var(--line-soft);
    padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;
    position:sticky;top:0;z-index:20;
  }
  .crumb{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;display:flex;gap:8px;align-items:center}
  .crumb b{color:var(--red);font-weight:600}
  .crumb span{color:#d5d8df}
  .topstat{display:flex;gap:10px;font-size:14px;color:var(--text);align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}

  .view{padding:32px;max-width:1400px;width:100%}
  .page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}
  .page-head h1{font-size:34px;letter-spacing:-.02em}
  .page-head p{font-size:17px;color:var(--text);margin-top:8px;max-width:760px}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
  .kpi b{display:block;font-size:30px;color:var(--ink);letter-spacing:-.02em;line-height:1.15}
  .kpi span{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}

  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .card + .card{margin-top:18px}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}
  .card-head h2{font-size:21px}
  .card-head .hint{font-size:14px;color:var(--muted)}

  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;
    background:var(--red);color:#fff;font-weight:600;font-size:16px;transition:background .15s ease;
  }
  .btn:hover{background:var(--red-dark)}
  .btn.ghost{background:#fff;color:var(--red);border:1px solid #f0c7cc}
  .btn.ghost:hover{background:var(--red-pale)}
  .btn.small{padding:7px 14px;font-size:14px;border-radius:8px}
  .btn.quiet{background:#fff;color:#55595f;border:1px solid var(--line)}
  .btn.quiet:hover{background:#fbfbfe;color:var(--red)}

  table.tbl{width:100%;border-collapse:collapse;font-size:16px}
  table.tbl th{
    text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    font-weight:600;padding:0 14px 12px 0;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.tbl td{padding:14px 14px 14px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:0}
  table.tbl td.name{color:var(--ink);font-weight:600}
  .mono{font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:14.5px;color:#33383d}
  .nowrap{white-space:nowrap}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  .badge{display:inline-block;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;border-radius:999px;white-space:nowrap}
  .badge.auto,.badge.ok{background:var(--green-pale);color:var(--green)}
  .badge.review,.badge.watch{background:var(--amber-pale);color:var(--amber)}
  .badge.manual,.badge.risk{background:var(--red-pale);color:var(--red)}
  .badge.gray{background:#f2f3f7;color:#6d7278}

  .bar{height:8px;border-radius:999px;background:#f2f3f7;overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;background:var(--red);border-radius:999px}
  .bar i.green{background:var(--green)}
  .bar i.amber{background:#e0a13a}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:15px;color:#55595f}
  .chip:hover{color:var(--red);border-color:#f0c7cc}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .chip i{font-style:normal;opacity:.65;margin-left:6px;font-size:13px}

  pre{margin:0;background:#fbfbfe;border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px;overflow:auto;max-height:380px;font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:14.5px;line-height:1.65;color:#33383d}
  pre .c{color:#9aa3ab}

  .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  .stack{display:grid;gap:18px}
  .list{margin:0;padding:0;list-style:none}
  .list li{padding:12px 0;border-bottom:1px dashed var(--line-soft);font-size:16px;display:flex;gap:12px;align-items:flex-start}
  .list li:last-child{border-bottom:0}
  .list b{color:var(--ink)}
  .empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:16px;text-align:center}

  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  textarea,input[type=text]{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:17px;color:var(--ink);
  }
  textarea{min-height:104px;resize:vertical;line-height:1.55}
  textarea:focus,input[type=text]:focus{outline:2px solid #f3c2c8;border-color:#eab6bd}

  .toggle{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:16px}
  .toggle button{width:46px;height:26px;border-radius:999px;background:#e3e5ec;position:relative;transition:background .15s ease;flex:0 0 46px}
  .toggle button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s ease}
  .toggle button.on{background:var(--red)}
  .toggle button.on::after{left:23px}

  .chat{display:flex;flex-direction:column;gap:14px}
  .msg{border-radius:14px;padding:16px 18px;font-size:16.5px;line-height:1.55;max-width:92%}
  .msg.q{background:var(--red-pale);color:#7c1724;align-self:flex-end}
  .msg.a{background:#fff;border:1px solid var(--line-soft)}
  .sources{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .src{font-size:13px;background:#f2f3f7;color:#55595f;border-radius:999px;padding:4px 11px}

  .meter{display:flex;align-items:center;gap:12px}
  .meter .bar{flex:1}

  .num{font-size:13px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

  @media (max-width:1100px){ .cols{grid-template-columns:1fr} }
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line-soft);padding-bottom:12px}
    .side-nav{display:grid;grid-template-columns:1fr 1fr}
    .view{padding:20px}
    .page-head h1{font-size:27px}
    .topbar{height:auto;padding:12px 20px;flex-direction:column;align-items:flex-start;gap:6px}
    .kpis{grid-template-columns:1fr 1fr}
    table.tbl{font-size:15px}
  }
</style>
</head>

    <div class="view" id="view"></div>
  </main>
</div>

<script>

    { id: "s2t", num: "01", name: "Карта данных", file: "cases/s2t.py", hint: "Source-to-Target Mapping" },
    { id: "dq", num: "02", name: "Качество данных", file: "cases/dq.py", hint: "Профилирование legacy" },

    { id: "postings", num: "05", name: "Проводки", file: "cases/postings.py", hint: "Двойная запись" },
    { id: "cutover", num: "06", name: "Cut-over", file: "cases/cutover.py", hint: "Процесс переключения" },
    { id: "rag", num: "07", name: "Ассистент", file: "cases/rag.py", hint: "Регламенты и РКО" },

  var state = { screen: "s2t", dqRan: false, ruleSql: null, chat: [], reconcileFilter: "Все", s2tStatus: {} };

  var LEGACY = [
    { id: "f1", table: "PAYMENT_DOC", field: "SUMMA", type: "NUMBER(15,2)", dom: "РКО", rows: 184320, nulls: 12 },

  ];

  var CFT = ["AMOUNT", "DOC_DATE", "PAYER_ACCOUNT", "CURRENCY", "STATUS", "INN", "CLIENT_NAME", "CLIENT_CODE",
    "CREDIT_ID", "CREDIT_AMOUNT", "RATE", "CLOSE_DATE", "DEPOSIT_ID", "BALANCE", "DEPOSIT_RATE",
    "ACCOUNT_DT", "ACCOUNT_KT", "POSTING_AMOUNT", "OPER_DATE", "CARD_ID", "CARD_NUMBER", "BIK",
    "BALANCE_DT", "BALANCE_KT"];

  var SYN = {
    summa: "amount", data: "date", nschet: "account", schet: "account", schet_dt: "account_dt",
    val: "currency", valuta: "currency", naim: "name", kod: "code", kredit: "credit", dep: "deposit",
    ostatok: "balance", ost: "balance", proc: "rate", stavka: "rate", zakr: "close", nomyer: "number",
    nomer: "number", oper: "oper", dokument: "doc", doc: "doc"
  };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }

  function esc(value) {
    return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function tokens(value) {
    return value.toLowerCase().replace(/ё/g, "е").split(/[._\s]+/).filter(Boolean)
      .map(function (token) { return SYN[token] || token; });
  }

  function dice(left, right) {
    var a = tokens(left), b = tokens(right);
    var shared = a.filter(function (token) { return b.indexOf(token) !== -1; }).length;
    return Math.round((2 * shared) / (a.length + b.length) * 100) / 100;
  }

  function bestMatch(item) {
    var scored = CFT.map(function (name) { return { target: name, score: dice(item.field, name) }; });
    scored.sort(function (x, y) { return y.score - x.score; });
    return scored[0];
  }

  function level(score) {
    return score >= 0.9 ? "auto" : score >= 0.6 ? "review" : "manual";
  }

  function levelRu(name) {
    return name === "auto" ? "авто" : name === "review" ? "на ревью" : "вручную";
  }

  var MAPPING = LEGACY.map(function (item) {
    var best = bestMatch(item);
    return { item: item, target: best.target, score: best.score, level: level(best.score) };
  });

  var INN_W10 = [2, 4, 10, 3, 5, 9, 4, 6, 8];

  var INN_W12 = [3, 7, 2, 4, 10, 3, 5, 9, 4, 6, 8];

  function control(digits, weights) {
    var sum = 0;
    weights.forEach(function (weight, index) { sum += digits[index] * weight; });
    return (sum % 11) % 10;
  }

  function digitsOf(value) {
    return value.split("").map(Number);
  }

  function innValid(value) {
    var ok = /^\d{10}$/.test(value) ? control(digitsOf(value), INN_W10) === Number(value[9]) : false;
    var ok12 = /^\d{12}$/.test(value)
      ? control(digitsOf(value), INN_W11) === Number(value[10]) && control(digitsOf(value), INN_W12) === Number(value[11])
      : false;
    return /^\d{10}$/.test(value) ? ok : ok12;
  }

  function bikValid(value) {
    return /^04\d{7}$/.test(value);

      var ok = row.delta === 0;
      return "<tr><td class='mono'>" + esc(row.account) + "</td><td class='mono nowrap'>" + esc(row.date) + "</td>" +
        "<td class='mono nowrap'>" + money(row.dt) + "</td><td class='mono nowrap'>" + money(row.kt) + "</td>" +
        "<td class='mono name nowrap'>" + money(row.delta) + "</td>" +
        "<td><span class='badge " + (ok ? "ok" : "risk") + "'>" + (ok ? "сбалансировано" : "разбаланс") + "</span></td></tr>";
    }).join("");

    return head("Проводки", "Контроль двойной записи и хронологии в загруженной волне: Дт и Кт по счёту, обратные и задним числом проведённые документы.", "") +
      '<div class="kpis">' + kpi("счетов", POSTINGS.length) + kpi("разбалансов", bad.length) +
      kpi("сумма разбаланса", money(total) + " ₽") + kpi("проверка", "< 15 мин") + "</div>" +
      '<div class="card"><div class="card-head"><h2>Двойная запись по счетам</h2><span class="hint">cft.posting · wave 4</span></div>' +
      "<div style='overflow-x:auto'><table class='tbl'><thead><tr><th>Счёт</th><th>Дата</th><th>Дт</th><th>Кт</th><th>Дельта</th><th>Статус</th></tr></thead><tbody>" +
      rows + "</tbody></table></div></div>" +
      "<div class='card'><div class='card-head'><h2>Хронология</h2><span class='hint'>проводки задним числом и закрытые периоды</span></div><ul class='list'>" +
      CHRONO_BAD.map(function (row) {
        return "<li><div class='badge manual'>риск</div><div><b class='mono'>" + esc(row.doc) + "</b> · счёт " + esc(row.account) + " · " + esc(row.date) + " — " + esc(row.note) + "</div></li>";
      }).join("") + "</ul></div>";
  }

  function screenCutover() {
    var gaps = CONTROLS.filter(function (pair) { return !PROCESS.controls[pair[0]]; }).map(function (pair) { return pair[0]; });
    var critical = gaps.filter(function (key) { return key === "rollback" || key === "checkpoint"; }).length;
    var coverage = Math.round((1 - gaps.length / CONTROLS.length) * 100);
    var semantic = PROCESS.steps.filter(function (step) { return !step.role || !step.output; });

    var toggles = CONTROLS.map(function (pair) {
      var on = PROCESS.controls[pair[0]];
      return "<div class='toggle'><button class='" + (on ? "on" : "") + "' data-act='control' data-key='" + pair[0] + "' aria-label='" + esc(pair[1]) + "'></button><span>" + esc(pair[1]) + "</span></div>";
    }).join("");

    var steps = PROCESS.steps.map(function (step) {
      var gap = !step.role || !step.output;
      return "<tr><td class='mono'>" + esc(step.id) + "</td><td class='name'>" + esc(step.name) + "</td>" +
        "<td>" + (step.role ? esc(step.role) : "<span class='badge risk'>нет роли</span>") + "</td>" +
        "<td>" + (step.output ? esc(step.output) : "<span class='badge risk'>нет выхода</span>") + "</td></tr>";
    }).join("");

    var banner = critical
      ? "<div class='card' style='border-color:#f3c2c8;background:var(--red-pale)'><b style='color:var(--red)'>Переключение заблокировано:</b> не закрыты критичные контроли (" + (PROCESS.controls.rollback ? "" : "откат, ") + (PROCESS.controls.checkpoint ? "" : "критерий готовности") + ").</div>"
      : "<div class='card' style='border-color:#cbe7d6;background:var(--green-pale)'><b style='color:var(--green)'>Процесс готов:</b> все контроли закрыты, можно назначать дату cut-over.</div>";

    return head("Cut-over", "Полнота процесса переключения на ЦФТ-Банк: владелец шага, точка отката, окно простоя, критерий готовности. Незакрытые контроли блокируют дату.", "") +
      '<div class="kpis">' + kpi("шагов", PROCESS.steps.length) + kpi("покрытие контролей", coverage + "%") +
      kpi("пропусков в шагах", semantic.length) + kpi("критичных дыр", critical) + "</div>" + banner +
      '<div class="cols" style="margin-top:18px">' +
      "<div class='card'><div class='card-head'><h2>Контроли процесса</h2><span class='hint'>нажмите, чтобы закрыть</span></div>" + toggles + "</div>" +
      "<div class='card'><div class='card-head'><h2>Шаги</h2><span class='hint'>BPMN · run " + esc(PROCESS.id) + "</span></div>" +
      "<div style='overflow-x:auto'><table class='tbl'><thead><tr><th>Шаг</th><th>Название</th><th>Роль</th><th>Выход</th></tr></thead><tbody>" +
      steps + "</tbody></table></div></div></div>";
  }

  function screenRag() {
    var cards = state.chat.map(function (item) {
      if (item.role === "q") { return "<div class='msg q'>" + esc(item.text) + "</div>"; }
      var sources = item.sources && item.sources.length
        ? "<div class='sources'>" + item.sources.map(function (src) { return "<span class='src'>" + esc(src) + "</span>"; }).join("") + "</div>"
        : "";
      return "<div class='msg a'>" + esc(item.text) + sources + "</div>";
    }).join("");

    var quick = ["Как закрыть счёт при блокировке?", "Куда переносим проценты на 47427?", "Пролонгация депозита", "Что такое криптобиржа?"];

    return head("Ассистент по домену", "Поиск по регламентам РКО, кредитов и депозитов. Ответ строится только по найденным документам и всегда показывает источник; если источника нет — отказывается.", "") +
      '<div class="cols"><div class="card"><div class="card-head"><h2>Диалог</h2><span class="hint">' + DOCS.length + " документов в индексе</span></div>" +
      "<div class='chat' id='chat'>" + (cards || "<div class='empty'>Задайте вопрос по регламентам — ассистент ответит с ссылкой на документ.</div>") + "</div>" +
      "<div class='field' style='margin-top:16px'><label>Вопрос</label><input type='text' id='chat-input' placeholder='Например: досрочное погашение кредита'></div>" +
      "<div class='toolbar' style='margin-top:12px'><button class='btn' data-act='chat-send'>Спросить</button>" +
      quick.map(function (text) { return "<button class='chip' data-act='chat-quick' data-q='" + esc(text) + "'>" + esc(text) + "</button>"; }).join("") +
      "</div></div>" +
      "<div class='card'><div class='card-head'><h2>Источники</h2></div><ul class='list'>" +
      DOCS.map(function (doc) {
        return "<li><div class='badge gray'>" + esc(doc.domain) + "</div><div><b class='mono'>" + esc(doc.id) + "</b><br>" + esc(doc.text) + "</div></li>";
      }).join("") + "</ul></div></div>";
  }

  function screenTower() {
    var totalProgress = DOMAINS.reduce(function (sum, domain) { return sum + domain.weight * domain.progress; }, 0);
    var remain = 100 - Math.round(totalProgress * 100);
    var average = DOMAINS[4].velocity.reduce(function (a, b) { return a + b; }, 0) / DOMAINS[4].velocity.length;
    var weeks = Math.max(Math.round((100 - DOMAINS[4].progress * 100) / average), 0);
    var forecast = new Date(2026, 10, 8 + weeks * 7);
    var forecastText = forecast.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });

    var rows = DOMAINS.map(function (domain) {
      var score = riskScore(domain);
      var status = riskStatus(score);
      return "<tr><td class='name'>" + esc(domain.name) + "</td><td class='num'>" + domain.weight.toFixed(2) + "</td>" +
        "<td><div class='meter'><div class='bar'><i class='green' style='width:" + Math.round(domain.progress * 100) + "%'></i></div><span class='num'>" + Math.round(domain.progress * 100) + "%</span></div></td>" +
        "<td>" + domain.open_defects + "</td><td>" + domain.s2t_gaps + "</td><td>" + domain.dq_failed + "</td>" +
        "<td><div class='meter'><div class='bar'><i class='" + (status === "risk" ? "" : status === "watch" ? "amber" : "green") + "' style='width:" + Math.round(score * 100) + "%'></i></div><span class='num'>" + score.toFixed(2) + "</span></div></td>" +
        "<td><span class='badge " + status + "'>" + riskRu(score) + "</span></td></tr>";
    }).join("");

    return head("Готовность к волне", "Взвешенный прогресс по доменам, риск-скоринг по дефектам, пропускам карты данных и качеству, прогноз даты по скорости прошлых волн.", "") +
      '<div class="kpis">' + kpi("готовность", pct(totalProgress)) + kpi("осталось", remain + "%") +
      kpi("прогноз даты", forecastText) + kpi("доменов в риске", DOMAINS.filter(function (d) { return riskStatus(riskScore(d)) === "risk"; }).length) + "</div>" +
      '<div class="card"><div class="card-head"><h2>Домены</h2><span class="hint">вес × прогресс = вклад в готовность</span></div>' +
      "<div style='overflow-x:auto'><table class='tbl'><thead><tr><th>Домен</th><th>Вес</th><th>Прогресс</th><th>Дефекты</th><th>S2T</th><th>DQ</th><th>Риск</th><th>Статус</th></tr></thead><tbody>" +
      rows + "</tbody></table></div></div>";
  }

  var RENDER = {
    s2t: screenS2T, dq: screenDQ, reconcile: screenReconcile, rule2sql: screenRule2SQL,
    postings: screenPostings, cutover: screenCutover, rag: screenRag, tower: screenTower
  };

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    SCREENS.forEach(function (screen) {
      var button = el("button", "navitem" + (state.screen === screen.id ? " on" : ""));
      button.type = "button";
      button.dataset.screen = screen.id;
      button.appendChild(el("i", null, screen.num));
      button.appendChild(el("span", null, screen.name));
      nav.appendChild(button);
    });
  }

  function render() {
    var screen = SCREENS.filter(function (item) { return item.id === state.screen; })[0];
    document.getElementById("crumb-here").textContent = screen.name;
    var view = document.getElementById("view");
    view.innerHTML = RENDER[state.screen]();
    renderNav();
  }

  document.getElementById("nav").addEventListener("click", function (event) {
    var target = event.target.closest("[data-screen]");
    if (!target) { return; }
    state.screen = target.dataset.screen;
    render();
  });

  function pushChat(question) {
    var docs = retrieve(question, null);
    state.chat.push({ role: "q", text: question });
    state.chat.push({
      role: "a",
      text: docs.length ? "По документу «" + docs[0].id + "»: " + docs[0].text + "." : REFUSAL,
      sources: docs.map(function (doc) { return doc.id; })
    });
    render();
  }

  document.getElementById("view").addEventListener("click", function (event) {
    var target = event.target.closest("[data-act]");
    if (!target) { return; }
    var act = target.dataset.act;

    if (act === "accept" || act === "reject") {
      state.s2tStatus[target.dataset.id] = act === "accept" ? "confirmed" : "rejected";
      render();
    }
    if (act === "dq-scan") { state.dqRan = true; render(); }
    if (act === "filter") { state.reconcileFilter = target.dataset.cause; render(); }
    if (act === "rule-compile" || act === "rule-sample") {
      var field = document.getElementById("rule-text");
      var text = act === "rule-sample" ? sampleRule(target.dataset.sample) : field.value;
      if (act === "rule-sample" && field) { field.value = text; }
      var key = ruleKeyword(text);
      state.ruleSql = key ? { key: key } : null;
      render();
    }
    if (act === "control") {
      PROCESS.controls[target.dataset.key] = !PROCESS.controls[target.dataset.key];
      render();
    }
    if (act === "chat-send") {
      var input = document.getElementById("chat-input");
      var question = input && input.value.trim();
      if (question) { pushChat(question); }
    }
    if (act === "chat-quick") { pushChat(target.dataset.q); }
    if (act === "reconcile-export") { target.textContent = "Выгружено: recon-wave-4.xlsx"; }
  });

  function sampleRule(key) {
    var samples = {
      deposit: "Депозит юридического лица: пролонгация и начисление процентов",
      card: "Операции по карте без авторизации отправляем в карантин"
    };
    return samples[key] || samples.deposit;
  }

  render();
  window.__app = { counts: counts, mapping: MAPPING, recon: RECON, risk: DOMAINS.map(riskScore), dq: dqIssues() };
})();
</script>
</body>
</html>
