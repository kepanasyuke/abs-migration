# ruff.toml — правила код-стиля из портфолио
line-length = 120
target-version = "py312"

[lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM",
    "RET",      # один выход: без лишних return
    "PLR0911",  # максимум один return
    "PLR0912",  # без раздутой ветвистости
    "PLR0915",  # без длинных тел
    "C901",     # сложность функции
    "ARG", "ANN",
]
ignore = ["ANN401"]

[lint.pylint]
max-returns = 1
max-statements = 8
max-branches = 2

[lint.flake8-annotations]
mypy-init-return = true

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Body", "fastapi.Query"]

[lint.isort]
known-first-party = ["cases"]
